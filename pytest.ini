[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:The HMAC key is:UserWarning
markers =
    unit: isolated tests that do not need docker-compose
    health: liveness and readiness of microservices and infrastructure
    e2e: end-to-end flows against a running stack
    security: defensive checks that the app rejects unauthenticated or invalid input
    security_audit: production-bar expectations that surface known hardening gaps
    concurrency: race conditions, parallel requests, and lock contention
    load: concurrency and throughput
    slow: long-running tests
    chaos: destructive process-kill tests; opt-in only
