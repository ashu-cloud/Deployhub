version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: deployhub_postgres
    environment:
      POSTGRES_USER: deployhub
      POSTGRES_PASSWORD: password
      POSTGRES_DB: deployhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deployhub"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: deployhub_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - deployhub_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: deployhub_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - deployhub_network

  caddy:
    image: caddy:2.7-alpine
    container_name: deployhub_caddy
    command: caddy run --config /etc/caddy/Caddyfile
    ports:
      - "80:80"
      - "443:443"
      - "2019:2019" # Admin API
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile
    networks:
      - deployhub_network

  kafka:
    image: apache/kafka:3.7.0
    container_name: deployhub_kafka
    environment:
      # KRaft mode — no ZooKeeper required (Kafka 3.7+)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: deployhub-kafka-cluster-001
    ports:
      - "19092:19092"   # External access (host → Kafka)
      - "9092:9092"     # Internal broker port
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - deployhub_network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: deployhub_auth_service
    environment:
      DATABASE_URL: postgresql+asyncpg://deployhub:password@postgres:5432/deployhub
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-dummy_client_id}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-dummy_client_secret}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - deployhub_network

  project-service:
    build:
      context: ./services/project-service
      dockerfile: Dockerfile
    container_name: deployhub_project_service
    environment:
      DATABASE_URL: postgresql+asyncpg://deployhub:password@postgres:5432/deployhub
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - deployhub_network

  deployment-service:
    build:
      context: ./services/deployment-service
      dockerfile: Dockerfile
    container_name: deployhub_deployment_service
    environment:
      DATABASE_URL: postgresql+asyncpg://deployhub:password@postgres:5432/deployhub
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CADDY_ADMIN_URL: http://caddy:2019
    ports:
      - "8006:8006"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - deployhub_network

  upload-service:
    build:
      context: ./services/upload-service
      dockerfile: Dockerfile
    container_name: deployhub_upload_service
    environment:
      DATABASE_URL: postgresql+asyncpg://deployhub:password@postgres:5432/deployhub
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
    ports:
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - deployhub_network

  build-orchestrator:
    build:
      context: ./services/build-orchestrator
      dockerfile: Dockerfile
    container_name: deployhub_build_orchestrator
    environment:
      DATABASE_URL: postgresql+asyncpg://deployhub:password@postgres:5432/deployhub
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8004:8004"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - deployhub_network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  kafka_data:

networks:
  deployhub_network:
    driver: bridge


