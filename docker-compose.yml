# Secrets (JWT keypair, WEBHOOK_SECRET, ENV_VAR_ENCRYPTION_KEY, POSTGRES/MINIO
# passwords) are never hardcoded here. Run `python scripts/generate_secrets.py`
# once, then start with:
#   docker-compose --env-file secrets/compose.env up -d --build

services:
  postgres:
    image: postgres:15-alpine
    container_name: deployhub_postgres
    environment:
      POSTGRES_USER: deployhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD -- run python scripts/generate_secrets.py}
      POSTGRES_DB: deployhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deployhub"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - deployhub_network

  redis:
    image: redis:7-alpine
    container_name: deployhub_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-deployhub_redis_pass_123}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - deployhub_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-deployhub_redis_pass_123}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: deployhub_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD -- run python scripts/generate_secrets.py}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - deployhub_network

  caddy:
    image: caddy:2.7-alpine
    container_name: deployhub_caddy
    command: caddy run --config /etc/caddy/Caddyfile
    ports:
      - "80:80"
      - "443:443"
      # Admin API (:2019) is intentionally NOT published -- it is reachable
      # only over the Unix socket shared with deployment-service below.
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_admin_socket:/srv/caddy-admin
    networks:
      - deployhub_network

  kafka:
    image: apache/kafka:3.7.0
    container_name: deployhub_kafka
    environment:
      # KRaft mode — no ZooKeeper required (Kafka 3.7+)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: deployhub-kafka-cluster-001
    ports:
      - "19092:19092"   # External access (host → Kafka)
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - deployhub_network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: deployhub_auth_service
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      JWT_PRIVATE_KEY_PATH: /secrets/jwt/private.pem
      JWT_PUBLIC_KEY_PATH: /secrets/jwt/public.pem
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:3000/api/v1/auth/callback}
    volumes:
      - ./secrets/jwt:/secrets/jwt:ro
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - deployhub_network

  project-service:
    build:
      context: ./services/project-service
      dockerfile: Dockerfile
    container_name: deployhub_project_service
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Set WEBHOOK_SECRET -- run python scripts/generate_secrets.py}
      ENV_VAR_ENCRYPTION_KEY: ${ENV_VAR_ENCRYPTION_KEY:?Set ENV_VAR_ENCRYPTION_KEY -- run python scripts/generate_secrets.py}
      JWT_PUBLIC_KEY_PATH: /secrets/jwt/public.pem
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-http://localhost:3000/api/v1}
      GITHUB_API_TOKEN: ${GITHUB_API_TOKEN:-}
    volumes:
      - ./secrets/jwt:/secrets/jwt:ro
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - deployhub_network

  deployment-service:
    build:
      context: ./services/deployment-service
      dockerfile: Dockerfile
    container_name: deployhub_deployment_service
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      CADDY_ADMIN_URL: ${CADDY_ADMIN_URL}
      JWT_PUBLIC_KEY_PATH: /secrets/jwt/public.pem
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      MINIO_DIAL: minio:9000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - ./secrets/jwt:/secrets/jwt:ro
      - caddy_admin_socket:/srv/caddy-admin
    ports:
      - "8006:8006"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - deployhub_network

  upload-service:
    build:
      context: ./services/upload-service
      dockerfile: Dockerfile
    container_name: deployhub_upload_service
    environment:
      DATABASE_URL: ${DATABASE_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - builds_data:/tmp/builds
    ports:
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - deployhub_network

  build-orchestrator:
    build:
      context: ./services/build-orchestrator
      dockerfile: Dockerfile
    container_name: deployhub_build_orchestrator
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      GROQ_API_KEY: ${GROQ_API_KEY}
      BUILD_VOLUME_NAME: deployhub_builds
      ENV_VAR_ENCRYPTION_KEY: ${ENV_VAR_ENCRYPTION_KEY:?Set ENV_VAR_ENCRYPTION_KEY -- run python scripts/generate_secrets.py}
    ports:
      - "8004:8004"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - builds_data:/tmp/builds
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - deployhub_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deployhub_frontend
    profiles: ["web"]
    environment:
      AUTH_SERVICE_URL: http://auth-service:8001
      PROJECT_SERVICE_URL: http://project-service:8002
      DEPLOYMENT_SERVICE_URL: http://deployment-service:8006
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - project-service
      - deployment-service
    networks:
      - deployhub_network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  kafka_data:
  caddy_admin_socket:
  builds_data:
    name: deployhub_builds

networks:
  deployhub_network:
    driver: bridge
