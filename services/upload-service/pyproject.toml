[project]
name = "upload-service"
version = "0.1.0"
description = "Upload Service for DeployHub"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "sqlalchemy",
    "asyncpg",
    "aiokafka",
    "aiobotocore"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
