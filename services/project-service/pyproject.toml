[project]
name = "project-service"
version = "0.1.0"
description = "Project Service for DeployHub"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "httpx",
    "pyjwt",
    "cryptography",
    "redis",
    "aiokafka",
    "circuitbreaker",
    "tenacity"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
