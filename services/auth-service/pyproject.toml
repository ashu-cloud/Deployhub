[project]
name = "auth-service"
version = "0.1.0"
description = "Auth Service for DeployHub"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "httpx",
    "pyjwt",
    "cryptography",
    "redis"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
